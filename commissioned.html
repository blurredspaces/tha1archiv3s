<style>
  :root{
    --bg:#0a0a0a;
    --bg-elevated:#141414;
    --text:#f5f5f5;
    --text-dim:#a3a3a3;
    --text-faint:#6b6b6b;
    --accent:#ffffff;
    --line:rgba(245,245,245,.12);
    /* key cursor — horizontal, hotspot on the teeth at the leading edge */
    --cursor-light:url('assets/cursor/cursor-key-light.png') 2 7, auto;
    --cursor-dark:url('assets/cursor/cursor-key-dark.png') 2 7, auto;
  }

  /* the key replaces the pointer everywhere, incl. links (UA sets those to
     pointer, so they need naming explicitly rather than inheriting) */
  body,a,button,[role="button"],label,summary,input,textarea,select{
    /* !important because Tailwind's preflight injects button{cursor:pointer}
       after this stylesheet at equal specificity, which otherwise wins and
       drops the key on every button */
    cursor:var(--cursor-light) !important;
  }
  /* white sections flip to the black key so it stays visible */
  .on-white,.on-white a,.on-white button,.on-white input,.on-white textarea{
    cursor:var(--cursor-dark) !important;
  }

  *{ scroll-behavior:smooth; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Montserrat',sans-serif;
    font-weight:200;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  .font-serif{ font-family:'Montserrat',sans-serif; }
  .font-mono{ font-family:'Montserrat',sans-serif; }
  /* keep everything extra light (beats Tailwind's injected utilities) */
  .font-black,.font-bold,.font-extrabold,.font-semibold,.font-medium{ font-weight:200 !important; }
  h1,h2,h3,h4,strong,b{ font-weight:200; }

  ::selection{ background:var(--accent); color:#0b0a09; }

  /* film grain overlay */
  .grain{
    position:fixed; inset:0; z-index:60; pointer-events:none;
    opacity:.05; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .tracked{ letter-spacing:.16em; }
  .tracked-tight{ letter-spacing:-.03em; }

  a, button{ transition:color .3s cubic-bezier(.19,1,.22,1), opacity .3s cubic-bezier(.19,1,.22,1); }
  a:focus-visible, button:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  /* raw nav bar */
  .raw-nav a{
    color:#f5f5f5; font-weight:200;
    text-shadow:0 1px 12px rgba(0,0,0,.75);
    filter:blur(0);
    transition:filter .35s cubic-bezier(.19,1,.22,1);
  }
  .raw-nav a:hover, .raw-nav a:focus-visible{ filter:blur(2.2px); }

  /* video grid tiles */
  .flat-tile{ position:relative; overflow:hidden; display:block; }
  .flat-tile img{ transition:transform .8s cubic-bezier(.19,1,.22,1); }
  /* hovering anywhere in the tile — thumbnail or credit — scales the still */
  .tile-link:hover .flat-tile img, .tile-link:focus-visible .flat-tile img{ transform:scale(1.04); }
  .tile-link{ display:block; width:100%; text-align:inherit; background:none; border:0; padding:0; }

  /* The one commissioned film with a public link carries a play mark. It is
     a span, not a button: the whole tile is already the button, and nesting
     one inside another is invalid and unreachable by keyboard. */
  .play-mark{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.28); color:#fff;
    transition:background-color .4s ease;
  }
  .tile-link:hover .play-mark, .tile-link:focus-visible .play-mark{ background:rgba(0,0,0,.12); }
  .play-mark > span{
    width:60px; height:60px; border-radius:9999px;
    border:1px solid rgba(255,255,255,.85);
    display:flex; align-items:center; justify-content:center;
    padding-left:4px;                 /* optically centres the triangle */
    transition:transform .5s cubic-bezier(.19,1,.22,1), background-color .4s ease;
  }
  .tile-link:hover .play-mark > span, .tile-link:focus-visible .play-mark > span{
    transform:scale(1.08); background:rgba(255,255,255,.15);
  }

  /* ── still viewer ──────────────────────────────────────────
     Same lightbox as the personal page. These films have no public
     link to play, so the still takes the player's place and the full
     credit sits underneath it. */
  #viewer{
    position:fixed; inset:0; z-index:80;
    display:flex; align-items:center; justify-content:center;
    padding:1.5rem;
    background:rgba(6,6,6,.92);
    backdrop-filter:blur(14px);
    transition:opacity .4s cubic-bezier(.19,1,.22,1), visibility 0s;
  }
  /* visibility flips the instant the dialog opens, so it can take focus
     straight away, and is held back until the fade finishes on close.
     Transitioning it over .4s instead leaves it computed as hidden on the
     opening frame, and focus() on something invisible silently does nothing. */
  #viewer.is-closed{
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .4s cubic-bezier(.19,1,.22,1), visibility 0s .4s;
  }

  #viewerInner{
    width:100%; max-width:1100px;
    transform:scale(1);
    transition:transform .45s cubic-bezier(.19,1,.22,1);
  }
  #viewer.is-closed #viewerInner{ transform:scale(.97); }

  #viewerFrame{ position:relative; }
  #viewerFrame img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  #viewerFrame iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }

  #viewerClose{
    position:absolute; top:1.25rem; right:1.25rem;
    height:44px; width:44px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(245,245,245,.25);
    border-radius:9999px;
    background:rgba(20,20,20,.6);
    color:#f5f5f5;
    transition:transform .3s cubic-bezier(.19,1,.22,1), background-color .3s ease, border-color .3s ease;
  }
  #viewerClose:hover{ transform:scale(1.06); background:rgba(245,245,245,.14); border-color:rgba(245,245,245,.5); }
  #viewerClose:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  #viewerTitle em{ font-style:italic; }
  #viewerTitle .pt-title{ font-size:15px; color:rgba(245,245,245,.95); }
  #viewerTitle .pt-role{ margin-top:.5rem; color:rgba(245,245,245,.74); }
  #viewerTitle .pt-dir { color:rgba(245,245,245,.74); }
  #viewerTitle .pt-meta{
    margin-top:.85rem;
    font-size:11px; letter-spacing:.16em;
    color:rgba(245,245,245,.42);
  }
  #viewerTitle .pt-meta + .pt-meta{ margin-top:.2rem; }
  @media (min-width:768px){ #viewerTitle .pt-title{ font-size:17px; } }

  @media (prefers-reduced-motion: reduce){
    #viewer, #viewerInner{ transition-duration:.01ms; transition-delay:0s; }
  }

  /* reveal on scroll (paired with the observer at the end of the page —
     without it these tiles would stay at opacity 0) */
  .reveal{ opacity:0; transform:translateY(24px); transition:opacity .9s cubic-bezier(.19,1,.22,1), transform .9s cubic-bezier(.19,1,.22,1); }
  .reveal.is-visible{ opacity:1; transform:translateY(0); }
</style>

<script>
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('is-visible'); });
  }, { threshold: 0.15 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));

  /* Clicking a tile enlarges its still with the full credit underneath.
     These films have no public link, so there is nothing to play — the
     still is the content. Same open/close contract as the personal page. */
  (function(){
    var modal    = document.getElementById('viewer');
    var frame    = document.getElementById('viewerFrame');
    var caption  = document.getElementById('viewerTitle');
    var closeBtn = document.getElementById('viewerClose');
    var lastFocus = null;

    function open(tile){
      lastFocus = document.activeElement;

      if (tile.dataset.yt) {
        // the one film here with a public link plays rather than enlarging
        var f = document.createElement('iframe');
        f.src = 'https://www.youtube-nocookie.com/embed/' + tile.dataset.yt +
                '?autoplay=1&rel=0&modestbranding=1&playsinline=1';
        f.title = (tile.querySelector('.pt-title') || {}).textContent || 'Video';
        f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
        f.referrerPolicy = 'strict-origin-when-cross-origin';
        f.allowFullscreen = true;
        frame.replaceChildren(f);
      } else {
        var src = tile.querySelector('.flat-tile img');
        var img = document.createElement('img');
        img.src = src.currentSrc || src.src;
        img.alt = src.alt || '';
        frame.replaceChildren(img);
      }

      var credit = tile.querySelector('.tile-credit') || tile.querySelector('.mt-4');
      caption.innerHTML = credit ? credit.innerHTML : '';

      modal.classList.remove('is-closed');
      document.body.style.overflow = 'hidden';
      // the dialog is still visibility:hidden on this tick, and you cannot
      // focus what is not visible — wait a frame or focus silently fails and
      // leaves the keyboard behind the backdrop
      requestAnimationFrame(function(){ closeBtn.focus(); });
    }

    function close(){
      modal.classList.add('is-closed');
      document.body.style.overflow = '';
      frame.replaceChildren();
      if (lastFocus) lastFocus.focus();
    }

    document.querySelectorAll('.tile-link').forEach(function(tile){
      tile.addEventListener('click', function(e){
        e.stopPropagation();   // else it carries on to the backdrop underneath
        open(tile);
      });
    });

    closeBtn.addEventListener('click', close);

    // a backdrop dismissal needs press AND release on the backdrop, so a drag
    // that starts on the still and ends outside it does not close anything
    var pressedBackdrop = false;
    modal.addEventListener('mousedown', function(e){ pressedBackdrop = (e.target === modal); });
    modal.addEventListener('click', function(e){
      if (e.target === modal && pressedBackdrop) close();
      pressedBackdrop = false;
    });
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && !modal.classList.contains('is-closed')) close();
    });
  })();
</script>
