<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans:  ['Montserrat', 'sans-serif'],
          serif: ['Montserrat', 'sans-serif'],
          mono:  ['Montserrat', 'sans-serif'],
        },
      },
    },
  };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,200;0,300;0,400;1,200;1,300&display=swap" rel="stylesheet">
<title>thaiarchives — Director</title>

<style>
  :root{
    --bg:#0a0a0a;
    --text:#f5f5f5;
    --accent:#ffffff;
    /* key cursor — horizontal, hotspot on the teeth at the leading edge */
    --cursor-light:url('assets/cursor/cursor-key-light.png') 2 7, auto;
    --cursor-dark:url('assets/cursor/cursor-key-dark.png') 2 7, auto;
  }

  /* the key replaces the pointer everywhere, incl. links (UA sets those to
     pointer, so they need naming explicitly rather than inheriting) */
  body,a,button,[role="button"],label,summary,input,textarea,select{
    cursor:var(--cursor-light);
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Montserrat',sans-serif;
    font-weight:200;
    -webkit-font-smoothing:antialiased;
    /* the home page is the hero alone — nothing to scroll to */
    overflow:hidden;
  }
  .font-serif{ font-family:'Montserrat',sans-serif; }
  .font-mono{ font-family:'Montserrat',sans-serif; }
  .font-black,.font-bold,.font-extrabold,.font-semibold,.font-medium{ font-weight:200 !important; }
  h1,h2,h3,h4,strong,b{ font-weight:200; }

  ::selection{ background:var(--accent); color:#0b0a09; }

  /* film grain overlay */
  .grain{
    position:fixed; inset:0; z-index:60; pointer-events:none;
    opacity:.05; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .vignette{
    position:absolute; inset:0;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,.65) 100%);
  }

  .tracked{ letter-spacing:.16em; }

  .sprocket-col{
    background-image: radial-gradient(circle, rgba(243,237,225,.14) 1.5px, transparent 1.6px);
    background-size: 100% 34px;
  }

  /* raw nav bar */
  .raw-nav a{
    color:#f5f5f5; font-weight:200;
    text-shadow:0 1px 12px rgba(0,0,0,.75);
    filter:blur(0);
    transition:filter .35s cubic-bezier(.19,1,.22,1);
  }
  .raw-nav a:hover, .raw-nav a:focus-visible{ filter:blur(2.2px); }

  /* ── lock gate ─────────────────────────────────────────────
     While locked the reel sits behind a heavy blur, the nav is
     softened and inert, and the logo is held back. Clicking the
     padlock adds .unlocked to <html> and everything resolves. The class
     goes on <html> (not <body>) so a returning session can be restored
     before first paint, without the gate flashing.  */
  .gate-media{
    filter:blur(20px);
    /* overfill so the blur doesn't pull transparent edges inward */
    transform:scale(1.12);
    transition:filter 1.1s cubic-bezier(.19,1,.22,1),
               transform 1.1s cubic-bezier(.19,1,.22,1);
  }
  html.unlocked .gate-media{ filter:blur(0); transform:scale(1); }

  .site-nav{
    filter:blur(5px);
    opacity:.4;
    pointer-events:none;
    transition:filter .9s cubic-bezier(.19,1,.22,1), opacity .9s cubic-bezier(.19,1,.22,1);
  }
  html.unlocked .site-nav{ filter:blur(0); opacity:1; pointer-events:auto; }

  .hero-logo-wrap{
    opacity:0;
    transition:opacity 1.3s cubic-bezier(.19,1,.22,1) .25s;
  }
  html.unlocked .hero-logo-wrap{ opacity:1; }
  .hero-logo{ opacity:.68; user-select:none; }

  #lockGate{
    transition:opacity .9s cubic-bezier(.19,1,.22,1), visibility .9s;
  }
  html.unlocked #lockGate{ opacity:0; visibility:hidden; pointer-events:none; }

  /* the padlock sits at 50% / 67.7% of the overlay art — the button is
     placed over it rather than making the whole image clickable */
  #unlockBtn{
    position:absolute;
    left:50%; top:67.7%;
    transform:translate(-50%,-50%);
    width:11%; min-width:52px;
    aspect-ratio:97/147;
    border:0; background:transparent;
    border-radius:9999px;
  }
  #unlockBtn::after{
    content:''; position:absolute; inset:-45%;
    border-radius:9999px;
    background:radial-gradient(circle, rgba(255,255,255,.20), rgba(255,255,255,0) 70%);
    opacity:.35;
    animation:breathe 3.2s ease-in-out infinite;
    transition:opacity .4s ease;
  }
  #unlockBtn:hover::after, #unlockBtn:focus-visible::after{ opacity:1; animation:none; }
  #unlockBtn:focus-visible{ outline:2px solid rgba(255,255,255,.8); outline-offset:6px; }

  /* call to action, sitting just below the padlock (its base is at ~79%) */
  .unlock-cta{
    position:absolute;
    left:50%; top:88%;
    transform:translateX(-50%);
    white-space:nowrap;
    pointer-events:none;
    font-size:11px;
    letter-spacing:.22em;
    color:rgba(255,255,255,.72);
    text-shadow:0 1px 12px rgba(0,0,0,.85);
  }
  /* wording follows the input device, not the screen width, so a touch
     laptop still reads "tap" */
  .unlock-cta .on-touch{ display:none; }
  @media (hover:none),(pointer:coarse){
    .unlock-cta .on-pointer{ display:none; }
    .unlock-cta .on-touch{ display:inline; }
  }

  /* restoring an already-unlocked session: settle instantly, no replay */
  html.no-gate-anim .gate-media,
  html.no-gate-anim .site-nav,
  html.no-gate-anim .hero-logo-wrap,
  html.no-gate-anim #lockGate{ transition:none !important; }
  @keyframes breathe{
    0%,100%{ opacity:.28; }
    50%    { opacity:.6; }
  }
  @media (prefers-reduced-motion: reduce){
    #unlockBtn::after{ animation:none; opacity:.6; }
    .gate-media,.site-nav,.hero-logo-wrap,#lockGate{ transition-duration:.01ms; }
  }
</style>

<script>
  /* restore an unlocked session before first paint so the gate never flashes */
  try{
    if(sessionStorage.getItem('thaiarchives:unlocked') === '1'){
      document.documentElement.classList.add('unlocked','no-gate-anim');
    }
  }catch(e){/* private mode / storage blocked — just show the gate */}
</script>

<div class="grain"></div>

<!-- ============ NAV ============ -->
<header class="site-nav fixed top-0 inset-x-0 z-50 flex justify-center pt-4 px-4">
  <nav class="raw-nav inline-flex items-center gap-4 md:gap-6 px-4 py-1.5 text-[11px] md:text-xs lowercase">
    <a href="personal.html">personal</a>
    <a href="commissioned.html">commissioned</a>
    <a href="info.html">info</a>
    <a href="contact.html">contact</a>
  </nav>
</header>

<!-- ============ HERO (the whole home page) ============ -->
<section id="home" class="relative h-[100svh] w-full overflow-hidden">

  <div class="gate-media absolute inset-0">
    <video id="heroReel"
      class="absolute inset-0 w-full h-full object-cover"
      autoplay muted playsinline preload="auto"
      poster="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1' height='1'><rect width='1' height='1' fill='%230a0a0a'/></svg>"></video>
    <div class="vignette"></div>
  </div>

  <script>
    /* Three montage cuts. Start on a random one so repeat visits differ,
       then rotate through the rest — a visitor who stays sees all three
       instead of the same loop. Only the current cut is fetched, so this
       costs no more bandwidth than a single reel. */
    (function(){
      var reels = [
        'assets/video/Main_Page_Montage_ver1.mp4',
        'assets/video/Main_Page_Montage_ver2.mp4',
        'assets/video/Main_Page_Montage_ver3.mp4'
      ];
      var v = document.getElementById('heroReel');
      var i = Math.floor(Math.random() * reels.length);

      function play(n){
        v.src = reels[n];
        var p = v.play();
        // autoplay may be deferred until the tab is visible — not an error
        if (p && p.catch) p.catch(function(){});
      }
      // no `loop` attribute: advance to the next cut instead of repeating
      v.addEventListener('ended', function(){
        i = (i + 1) % reels.length;
        play(i);
      });
      play(i);
    })();
  </script>

  <!-- sprocket edges -->
  <div class="hidden md:block absolute left-4 top-0 bottom-0 w-1 sprocket-col opacity-60"></div>
  <div class="hidden md:block absolute right-4 top-0 bottom-0 w-1 sprocket-col opacity-60"></div>

  <!-- revealed once unlocked -->
  <h1 class="hero-logo-wrap absolute inset-0 flex items-center justify-center px-6 md:px-12 py-20 md:py-24 pointer-events-none">
    <span class="sr-only">thaiarchives</span>
    <img src="assets/logo/ThaiArchives%20Logo%20white.png"
         alt="thaiarchives"
         class="hero-logo w-full h-full object-contain">
  </h1>
</section>

<!-- ============ LOCK GATE ============ -->
<div id="lockGate" class="fixed inset-0 z-[70] flex items-center justify-center px-6">
  <div class="relative w-full max-w-[760px]">
    <img src="assets/graphics/lock_overlay.png"
         alt="what i see, what i feel, what we feel."
         class="w-full h-auto select-none pointer-events-none">
    <button id="unlockBtn" type="button" aria-label="Unlock the site"></button>
    <p class="unlock-cta">
      <span class="on-pointer">click to unlock</span>
      <span class="on-touch">tap to unlock</span>
    </p>
  </div>
</div>

<script>
  (function(){
    var KEY  = 'thaiarchives:unlocked';
    var root = document.documentElement;
    var btn  = document.getElementById('unlockBtn');

    if (root.classList.contains('unlocked')) {
      // restored from an earlier unlock in this session
      btn.setAttribute('tabindex', '-1');
      requestAnimationFrame(function(){ root.classList.remove('no-gate-anim'); });
    }

    btn.addEventListener('click', function(){
      root.classList.add('unlocked');
      // sessionStorage: stays open for this tab, re-locks in a fresh one
      try{ sessionStorage.setItem(KEY, '1'); }catch(e){}
      // once open, the gate is no longer focusable
      btn.setAttribute('tabindex', '-1');
    });
  })();
</script>
