<style>
  :root{
    --bg:#0a0a0a;
    --text:#f5f5f5;
    --accent:#ffffff;
    /* key cursor — horizontal, hotspot on the teeth at the leading edge */
    --cursor-light:url('assets/cursor/cursor-key-light.png') 2 7, auto;
  }

  /* the key replaces the pointer everywhere, incl. links (UA sets those to
     pointer, so they need naming explicitly rather than inheriting) */
  body,a,button,[role="button"],label,summary,input,textarea,select{
    /* !important because Tailwind's preflight injects button{cursor:pointer}
       after this stylesheet at equal specificity, which otherwise wins and
       drops the key on every button */
    cursor:var(--cursor-light) !important;
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Montserrat',sans-serif;
    font-weight:200;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  .font-serif{ font-family:'Montserrat',sans-serif; }
  .font-mono{ font-family:'Montserrat',sans-serif; }
  .font-black,.font-bold,.font-extrabold,.font-semibold,.font-medium{ font-weight:200 !important; }
  h1,h2,h3,h4,strong,b{ font-weight:200; }

  ::selection{ background:var(--accent); color:#0b0a09; }

  /* The montage runs behind the page. 15% of the gate's 20px blur, with a
     slight overscan so the filter's falloff stays outside the frame, and a
     scrim over it so the address reads as clearly as it did on flat black. */
  .page-reel{ position:fixed; inset:0; z-index:0; overflow:hidden; }
  .page-reel video{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover;
    filter:blur(3px);
    transform:scale(1.03);
  }
  /* Flat scrim for the page, plus a bottom-weighted gradient: the footer's
     small translucent type is the hardest thing to keep legible over a lit
     frame, and the heading can afford a brighter ground than it can. */
  .page-reel .scrim{
    position:absolute; inset:0;
    background:
      linear-gradient(to bottom, rgba(8,8,8,0) 35%, rgba(8,8,8,.60) 100%),
      rgba(8,8,8,.62);
  }
  /* everything the reader touches sits above the reel */
  .page-content{ position:relative; z-index:10; }

  /* film grain overlay */
  .grain{
    position:fixed; inset:0; z-index:60; pointer-events:none;
    opacity:.05; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .tracked{ letter-spacing:.16em; }
  .tracked-tight{ letter-spacing:-.03em; }

  a, button{ transition:color .3s cubic-bezier(.19,1,.22,1), opacity .3s cubic-bezier(.19,1,.22,1); }
  a:focus-visible, button:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  /* raw nav bar */
  .raw-nav a{
    color:#f5f5f5; font-weight:200;
    text-shadow:0 1px 12px rgba(0,0,0,.75);
    filter:blur(0);
    transition:filter .35s cubic-bezier(.19,1,.22,1);
  }
  .raw-nav a:hover, .raw-nav a:focus-visible{ filter:blur(2.2px); }
</style>
